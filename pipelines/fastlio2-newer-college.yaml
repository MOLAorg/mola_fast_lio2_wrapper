# -----------------------------------------------------------------------------
# Fast-LIO2 algorithm parameters, tuned for the Newer College Dataset, 2020
# collection (Ouster OS1-64 + its built-in IMU, handheld pole rig walked
# around New College, Oxford).
#
# Starting point is fastlio2-oxford-spires.yaml's tuning: the same kind of
# platform (handheld, campus, mixed built and vegetated) at the same scan
# rate. Only the extrinsics and the sensor-specific notes below are changed;
# no Newer College specific retuning has been done yet, deliberately, so the
# first number this file produces is the like-for-like cross-method
# reference against mola_dlio_wrapper's dlio-newer-college.yaml (which is in
# the same unretuned state) and against mola_lidar_odometry's own
# newer-college profile.
#
# The 2021 collection (OS0-128 + Alphasense) is a different rig with
# different topic names and different extrinsics; it needs its own file.
# -----------------------------------------------------------------------------

# T_lidar_imu: pose of the IMU frame wrt the LiDAR frame. The wrapper inverts
# it itself for Fast-LIO2's own "LiDAR wrt IMU" extrinsic, so the raw value
# goes here. Same value, same convention and same origin as
# dlio-newer-college.yaml's imu_pose_in_lidar_str: composed from the bags'
# own /tf_static, and confirmed by the published kalibr output
# (04_calibration/kalibr_output/ouster_imu_lidar_transforms.yaml), whose
# quaternion (0, 0, 1, 0) is that 180 deg yaw.
#
# The 180 deg is the part that is easy to miss: the Ouster's IMU and lidar
# frames are anti-aligned in azimuth and only 0.032 m apart, so a
# translation-only version of this line is wrong twice over.
imu_pose_in_lidar: "-0.006253 0.011775 -0.028535 180 0 0"

# T_base_lidar: identity. base_link here IS the LiDAR
# (mola_lidar_odometry's newer-college profile sets
# MOLA_TF_BASE_LINK=os1_lidar), unlike Oxford Spires where base_link is a
# real 180 deg yaw away from it. Note this is NOT the frame the published
# ground truth is in -- that is a further 135 deg of yaw away, but it is the
# evaluation's business (dataset-map.yml's gt_body_offset), not this file's:
# every method must report in the same base_link for the comparison to mean
# anything.
baselink2lidar_pose_str: "0 0 0 0 0 0"

lidar_sensor_label: "lidar"
imu_sensor_label: "imu"

# Fallback only: the OS1-64 PointCloud2 in these bags carries a real
# per-point "t" field (UINT32, offset 20, in a 48-byte 1024x64 point --
# confirmed against the stripped bags), so this is unused in practice. The
# lidar runs at 10 Hz.
fallback_scan_period: 0.1

# IMU noise (generic MEMS-grade defaults, as everywhere else in this
# wrapper; the OS1's built-in IMU is not separately characterized):
gyr_cov: ${FASTLIO_GYR_COV|0.1}
acc_cov: ${FASTLIO_ACC_COV|0.1}
b_gyr_cov: 0.0001
b_acc_cov: 0.0001

# Map / matching parameters. Handheld platform on a campus route of a few
# hundred metres, so Oxford Spires' values carry over unchanged.
filter_size_surf: ${FASTLIO_FILTER_SIZE_SURF|0.3}
filter_size_map: ${FASTLIO_FILTER_SIZE_MAP|0.3}
cube_side_length: ${FASTLIO_CUBE_SIDE_LENGTH|500.0}
det_range: ${FASTLIO_DET_RANGE|100.0}
max_iteration: ${FASTLIO_MAX_ITERATION|3}
extrinsic_est_en: false
init_time: 0.1

# Minimum range: the rig is carried on a pole by a walking operator, so the
# carrier generates a dense near-field cluster rigidly attached to the
# sensor, which acts as a false zero-motion constraint on scan-to-map
# registration. Same 1.0 m cut, for the same reason, as the Oxford Spires
# handheld config.
blind: ${FASTLIO_BLIND|1.0}

# --- Estimated trajectory output ---
save_trajectory_to_file: ${MOLA_SAVE_TRAJECTORY|false}
trajectory_output_file: ${MOLA_TUM_TRAJECTORY_OUTPUT|'estimated_trajectory.tum'}
